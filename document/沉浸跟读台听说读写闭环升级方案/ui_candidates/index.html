<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoxLocal 沉浸跟读台 · Apple Design UI 候选方案对比</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei UI", sans-serif;
    background: #0a0c10;
    color: #f5f5f7;
    padding: 28px 32px 48px;
  }
  header {
    max-width: 1360px; margin: 0 auto 24px;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 18px;
  }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
  p.sub { color: rgba(245,245,247,0.65); font-size: 13.5px; margin-top: 6px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tab {
    padding: 8px 15px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06); color: #cbd5e1; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 140ms ease;
  }
  .tab.active { background: #0a84ff; border-color: #0a84ff; color: #fff; }
  .stage-wrap {
    max-width: 1360px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 14px;
  }
  .meta-card {
    background: #14171f; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;
    padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .swatches { display: flex; gap: 6px; }
  .sw { width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); }
  iframe {
    width: 100%; height: 680px; border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px; background: #06080f;
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>VoxLocal 沉浸跟读台 · Apple Design UI 候选方案</h1>
    <p class="sub">四套均已内置完整可交互四阶段状态机（盲听 → 录音计数 → 达标待写 → 防作弊默写 → 差异对照 OK），可直接点击下方画面体验动效与流转</p>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<div class="stage-wrap">
  <div class="meta-card">
    <div>
      <strong id="m-name" style="font-size:15px;"></strong>
      <div id="m-desc" style="font-size:12.5px;color:rgba(245,245,247,0.65);margin-top:3px;"></div>
    </div>
    <div class="swatches" id="m-swatches"></div>
  </div>
  <iframe id="frame"></iframe>
</div>
<script>
const ITEMS = [
  { id:'a', name:'方案 A · Vision 空间液态玻璃台', desc:'visionOS 空间毛玻璃悬浮层级 · 顶部四阶段胶囊 · 中央盲听遮罩 · 底部固定锚点形态变换主按钮', src:'candidate-a.html', colors:['#06080f','#181e2c','#0a84ff','#5ac8fa','#bf5af2','#30d158'] },
  { id:'b', name:'方案 B · Studio 暗夜播客与语音备忘录抽屉', desc:'Apple Music 大字排版 · Voice Memos 双环红键与实时声波 · 锚定底部 Sheet 默写隔离抽屉', src:'candidate-b.html', colors:['#0b0b0d','#1f1f24','#ff375f','#0a84ff','#bf5af2','#30d158'] },
  { id:'c', name:'方案 C · Books 温润纸墨专注学堂', desc:'Apple Books 护眼温润纸感（浅色极简） · New York 衬线精读排版 · 清晰纸墨批改对比', src:'candidate-c.html', colors:['#f5f2eb','#ffffff','#1d1d1f','#0071e3','#8944ab','#1e8e3e'] },
  { id:'d', name:'方案 D · Pro Audio 声学精密工作台', desc:'Logic Pro / HUD 控制台 · 右侧声学双阈值实时遥测表（≥1.0s & RMS）· 快捷键提示，与现有左侧语音面板无缝同源', src:'candidate-d.html', colors:['#090c12','#131927','#22d3ee','#818cf8','#fb7185','#34d399'] },
  { id:'e', name:'方案 E · macOS × Notion 极简原生浅色工作台', desc:'纯正 macOS 浅色毛玻璃导航 + Notion 极简效率留白 · 中性白底细线卡片 · Callout 盲听卡与苹果原生系统色', src:'candidate-e.html', colors:['#f3f4f6','#ffffff','#111827','#007aff','#8944ab','#248a3d'] }
];
let cur = 0;
function select(idx) {
  cur = idx;
  const it = ITEMS[idx];
  document.getElementById('m-name').textContent = it.name;
  document.getElementById('m-desc').textContent = it.desc;
  document.getElementById('frame').src = it.src;
  document.getElementById('m-swatches').innerHTML = it.colors.map(c => `<span class="sw" style="background:${c}" title="${c}"></span>`).join('');
  document.querySelectorAll('.tab').forEach((b, i) => b.classList.toggle('active', i === idx));
}
document.getElementById('tabs').innerHTML = ITEMS.map((it, i) => `<button class="tab" onclick="select(${i})">${it.name.split(' · ')[0]}</button>`).join('');
select(0);
</script>
</body>
</html>
